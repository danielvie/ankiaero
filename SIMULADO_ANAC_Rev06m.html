let QTD_QUESTOES = 20; // definido pelo usuário
let userName = "";

const materias = Object.keys(data);
let materiaIndex = 0;
let questoesRandomizadas = {};
let respostasUsuario = {};
let totalRespondidas = 0;
let totalAcertos = 0;
let statusFinal = null;

function iniciarPrompt() {
    const nome = document.getElementById('nome').value.trim();
    let qtd = parseInt(document.getElementById('qtd').value, 10);
    if (!nome) {
        alert("Por favor, informe seu nome.");
        document.getElementById('nome').focus();
        return;
    }
    if (isNaN(qtd) || qtd < 1 || qtd > 50) {
        alert("Informe uma quantidade de questões entre 1 e 50.");
        document.getElementById('qtd').focus();
        return;
    }
    userName = nome;
    QTD_QUESTOES = qtd;
    document.getElementById('user-prompt-bg').style.display = "none";
    iniciarSimulado();
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function iniciarSimulado() {
    materiaIndex = 0;
    questoesRandomizadas = {};
    respostasUsuario = {};
    totalRespondidas = 0;
    totalAcertos = 0;
    statusFinal = null;
    document.getElementById('final-result').innerHTML = '';
    for (const materia of materias) {
        let questoes = data[materia].slice();
        shuffleArray(questoes);
        questoesRandomizadas[materia] = questoes.slice(0, Math.min(QTD_QUESTOES, questoes.length));
        respostasUsuario[materia] = Array(questoesRandomizadas[materia].length).fill(null);
    }
    criarAbas();
    mostrarMateriaAtual();
    atualizarDashboard();
}

function criarAbas() {
    const tabBar = document.getElementById('tab-bar');
    tabBar.innerHTML = '';
    materias.forEach((materia, idx) => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (idx === materiaIndex ? ' active' : '');
        tab.textContent = materia;
        tab.onclick = () => {
            materiaIndex = idx;
            mostrarMateriaAtual();
        };
        tabBar.appendChild(tab);
    });
}

function mostrarMateriaAtual() {
    const tabContents = document.getElementById('tab-contents');
    tabContents.innerHTML = '';
    if (materiaIndex >= materias.length) {
        mostrarResultadoFinal();
        return;
    }
    const materia = materias[materiaIndex];
    const questoes = questoesRandomizadas[materia];
    const respostas = respostasUsuario[materia];
    const contentDiv = document.createElement('div');
    contentDiv.className = 'content visible';

    // Exibe todas as questões de uma vez
    questoes.forEach((q, idx) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        qDiv.innerHTML = `<strong>${idx+1}. ${q.pergunta}</strong><br>`;
        q.respostas.forEach(resp => {
            const respId = `q${materiaIndex}_${idx}_${resp}`.replace(/\W/g, '');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `alternativa_${idx}`;
            input.id = respId;
            input.value = resp;
            input.disabled = respostas[idx] !== null;
            if (respostas[idx] && respostas[idx].resposta === resp) input.checked = true;
            input.onclick = () => responder(idx, resp, q.resposta_correta);
            const label = document.createElement('label');
            label.htmlFor = respId;
            label.textContent = resp;
            label.id = `lbl-${respId}`;
            label.style.marginLeft = "5px";
            
            // Feedback visual
            if (respostas[idx]) {
                if (resp === respostas[idx].resposta) {
                    label.className = respostas[idx].correta ? 'correct' : 'incorrect';
                }
                if (!respostas[idx].correta && resp === q.resposta_correta) {
                    label.classList.add('show-correct');
                }
            }
            qDiv.appendChild(input);
            qDiv.appendChild(label);
            qDiv.appendChild(document.createElement('br'));
        });
        contentDiv.appendChild(qDiv);
    });

    // Botão de finalizar matéria
    const btn = document.createElement('button');
    btn.textContent = "Finalizar Matéria";
    btn.onclick = () => finalizarMateria();
    btn.disabled = respostasUsuario[materia].some(r => r === null);
    contentDiv.appendChild(btn);

    // Botão de refazer matéria (aparece só se já respondeu todas)
    if (respostasUsuario[materia].every(r => r !== null)) {
        const btnRefazer = document.createElement('button');
        btnRefazer.textContent = "Refazer Matéria";
        btnRefazer.style.marginLeft = "10px";
        btnRefazer.onclick = () => refazerMateria();
        contentDiv.appendChild(btnRefazer);
    }

    tabContents.appendChild(contentDiv);
    criarAbas();
    atualizarDashboard();
}

function responder(idx, resp, resposta_correta) {
    const materia = materias[materiaIndex];
    if (respostasUsuario[materia][idx] !== null) return; // já respondida
    const correta = resp === resposta_correta;
    respostasUsuario[materia][idx] = {resposta: resp, correta};
    totalRespondidas++;
    if (correta) totalAcertos++;
    mostrarMateriaAtual();
}

function finalizarMateria() {
    materiaIndex++;
    mostrarMateriaAtual();
}

function refazerMateria() {
    const materia = materias[materiaIndex];
    let questoes = data[materia].slice();
    shuffleArray(questoes);
    questoesRandomizadas[materia] = questoes.slice(0, Math.min(QTD_QUESTOES, questoes.length));
    respostasUsuario[materia] = Array(questoesRandomizadas[materia].length).fill(null);
    mostrarMateriaAtual();
}

function atualizarDashboard() {
    const dash = document.getElementById('dashboard');
    let html = `<div class="dash-title">Desempenho por Matéria</div>`;
    html += `<div class="dash-user"><b>Usuário:</b> ${userName}</div>`;
    let totalQuestoes = 0, totalAcertosFinal = 0;
    materias.forEach(materia => {
        const respostas = respostasUsuario[materia];
        const acertos = respostas.filter(r => r && r.correta).length;
        const total = respostas.length;
        totalQuestoes += total;
        totalAcertosFinal += acertos;
        const perc = total ? Math.round(100*acertos/total) : 0;
        html += `<div class="dash-materia"><b>${materia}</b> <span style="float:right">${perc}%</span>
            <div class="dash-bar-bg"><div class="dash-bar" style="width:${perc}%;background:${perc>=70?'#2196F3':'#f44336'}"></div></div>
        </div>`;
    });
    const percFinal = totalQuestoes ? Math.round(100*totalAcertosFinal/totalQuestoes) : 0;
    html += `<div class="dash-status"><b>Total:</b> ${totalAcertosFinal} / ${totalQuestoes} (${percFinal}%)<br>`;
    if (statusFinal !== null) {
        if (statusFinal === "reprovado") {
            html += `<div class="reprovado">${userName} você foi REPROVADO e precisa estudar mais!</div>
            <img class="dash-img" src="https://cj.estrategia.com/portal/wp-content/uploads/2025/02/25163302/pablomarcal-960x540.webp" alt="Reprovado">`;
        } else {
            html += `<div class="aprovado">Parabéns ${userName} você foi APROVADO!</div>`;
        }
    }
    html += `</div>`;
    dash.innerHTML = html;
}

function mostrarResultadoFinal() {
    const div = document.getElementById('final-result');
    div.innerHTML = '';
    let totalQuestoes = 0, totalAcertosFinal = 0;
    let html = `<div class="final-box"><h2>Resultado Final</h2>`;
    html += `<div style="font-size:1.1em; margin-bottom:10px;"><b>Usuário:</b> ${userName}</div>`;
    materias.forEach(materia => {
        const respostas = respostasUsuario[materia];
        const acertos = respostas.filter(r => r && r.correta).length;
        const total = respostas.length;
        totalQuestoes += total;
        totalAcertosFinal += acertos;
        html += `<div><b>${materia}:</b> ${acertos} / ${total} (${total ? Math.round(100*acertos/total) : 0}%)</div>`;
    });
    const perc = totalQuestoes ? Math.round(100*totalAcertosFinal/totalQuestoes) : 0;
    html += `<hr><b>Total:</b> ${totalAcertosFinal} / ${totalQuestoes} (${perc}%)<br>`;
    if (perc >= 70) {
        html += `<div class="aprovado"> Parabéns você foi APROVADO!</div>`;
        
        statusFinal = "aprovado";
    } else {
        html += `<div class="reprovado">
            ${userName} você foi REPROVADO!</div>`;
        statusFinal = "reprovado";
    }
    html += `<br><button onclick="iniciarSimulado()">Refazer Simulado</button></div>`;
    div.innerHTML = html;
    document.getElementById('tab-bar').innerHTML = '';
    document.getElementById('tab-contents').innerHTML = '';
    atualizarDashboard();
}

</script>
